name: ai_quiz_app
description: AI-powered quiz generator with local-first architecture and multiplayer support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  dio: ^5.8.0+1
  google_fonts: ^6.2.1
  fl_chart: ^0.71.0
  share_plus: ^11.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  app_links: ^6.4.0
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.7
  google_mobile_ads: ^5.3.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2
  equatable: ^2.0.7
  collection: ^1.19.1
  url_launcher: ^6.3.1
  file_picker: ^10.1.2
  path: ^1.9.1
  youtube_player_iframe: ^5.2.1
  webview_flutter: ^4.14.0
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^4.1.0
  timezone: ^0.10.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  isar_community_generator: ^3.3.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/learn_anything_logo.png
  adaptive_icon_background: '#0A0A0A'
  adaptive_icon_foreground: assets/branding/learn_anything_logo.png

flutter:
  generate: false
  uses-material-design: true
  assets:
    - assets/branding/
