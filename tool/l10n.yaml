# Reference config for tool/generate_l10n.py only.
# Do NOT place l10n.yaml in the project root — Flutter would try to
# regenerate lib/l10n at build time and fail on OneDrive/offline folders.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
nullable-getter: false
