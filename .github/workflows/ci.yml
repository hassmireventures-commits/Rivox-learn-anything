name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release hygiene gate
        run: dart run tool/check_release_hygiene.dart
      # --no-fatal-infos: info-level lints (style suggestions) stay visible in
      # the log but don't fail the build; only real errors/warnings do.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # API keys come from GitHub Actions secrets (uploaded with
      # tool/push_ci_secrets.ps1) and are written to the same gitignored file
      # local builds use. Secrets are empty on fork PRs; the build still
      # succeeds, the AI features just have no key.
      - name: Write dart-defines from secrets
        env:
          BUILT_IN_AI_API_KEY: ${{ secrets.BUILT_IN_AI_API_KEY }}
          WHISPER_API_KEY: ${{ secrets.WHISPER_API_KEY }}
          NVIDIA_VISION_API_KEY: ${{ secrets.NVIDIA_VISION_API_KEY }}
          NVIDIA_EMBED_API_KEY: ${{ secrets.NVIDIA_EMBED_API_KEY }}
          NVIDIA_OCR_API_KEY: ${{ secrets.NVIDIA_OCR_API_KEY }}
          NVIDIA_SAFETY_API_KEY: ${{ secrets.NVIDIA_SAFETY_API_KEY }}
          NVIDIA_SPARE_API_KEY: ${{ secrets.NVIDIA_SPARE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          jq -n 'env | {BUILT_IN_AI_API_KEY, WHISPER_API_KEY, NVIDIA_VISION_API_KEY,
                        NVIDIA_EMBED_API_KEY, NVIDIA_OCR_API_KEY, NVIDIA_SAFETY_API_KEY,
                        NVIDIA_SPARE_API_KEY, YOUTUBE_API_KEY} | map_values(. // "")' > tool/.local_dart_defines.json
          jq -r 'to_entries[] | "\(.key): \(if .value == "" then "missing" else "present" end)"' tool/.local_dart_defines.json
      # Free-tier NVIDIA latency varies, so this live check informs but never
      # fails the build. Main-branch pushes only (no secrets on PRs).
      - name: NVIDIA live probe (informational)
        if: github.event_name == 'push'
        continue-on-error: true
        run: flutter test test/nvidia_live_probe_test.dart --dart-define-from-file=tool/.local_dart_defines.json
      - name: Release APK compile check
        env:
          ALLOW_DEBUG_SIGNING: "true"
        run: flutter build apk --release --dart-define-from-file=tool/.local_dart_defines.json
      - name: Release App Bundle compile check
        env:
          ALLOW_DEBUG_SIGNING: "true"
        run: flutter build appbundle --release --dart-define-from-file=tool/.local_dart_defines.json
        # Store uploads still need a real upload keystore in CI secrets;
        # this job only proves the AAB builds (CI uses debug signing).
