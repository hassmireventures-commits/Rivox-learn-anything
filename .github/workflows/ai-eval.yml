# Nightly quality gate for the Built-in AI generation pipeline.
#
# Requires a `BUILT_IN_AI_API_KEY` repository secret (Settings -> Secrets and
# variables -> Actions) containing a valid NVIDIA NIM API key. Without it, the
# secret expands to an empty string, so the live-probe test's own `apiKey.isEmpty`
# check applies Dart's `skip:` mechanism and the run reports as skipped rather
# than failing — add the secret to actually exercise the models.
#
# Score history (v1 scope): there is no committed log file for this. Each run's
# stdout already contains a dated per-task score table via the test's own
# `_printReport` function, so historical scores are tracked by browsing past
# workflow run logs in the Actions tab. A committed JSON log with trend charts
# could be a future enhancement.
#
# Gate scope: only "router chain" fails the job. That sub-test exercises
# BuiltInAiRouter.withModelFallback — the exact path real quiz/path/daily-
# content generation takes in the app, including its retry-on-bad-output
# fallback to the secondary model. "primary model alone" and "fallback model"
# call one model with no cross-model fallback, so they're more exposed to
# ordinary LLM output variance (a single slow/truncated response) that never
# reaches real users because the router already retries past it. They still
# run every time for visibility (continue-on-error), just don't fail the job.
name: AI generation quality eval

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  live-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Router chain (gates this job)
        run: flutter test test/model_generation_live_probe_test.dart --plain-name "router chain" --dart-define=BUILT_IN_AI_API_KEY=${{ secrets.BUILT_IN_AI_API_KEY }}
      - name: Primary model alone (informational only)
        continue-on-error: true
        run: flutter test test/model_generation_live_probe_test.dart --plain-name "primary model alone" --dart-define=BUILT_IN_AI_API_KEY=${{ secrets.BUILT_IN_AI_API_KEY }}
      - name: Fallback model alone (informational only)
        continue-on-error: true
        run: flutter test test/model_generation_live_probe_test.dart --plain-name "fallback model" --dart-define=BUILT_IN_AI_API_KEY=${{ secrets.BUILT_IN_AI_API_KEY }}
      # Vision, OCR, embeddings, and safety (NVIDIA). Informational: catches
      # a retired model (like the 2026-09-01 Nemotron nano end of life) the
      # morning after it happens, without failing on free-tier slowness.
      - name: NVIDIA services (informational only)
        continue-on-error: true
        env:
          BUILT_IN_AI_API_KEY: ${{ secrets.BUILT_IN_AI_API_KEY }}
          NVIDIA_VISION_API_KEY: ${{ secrets.NVIDIA_VISION_API_KEY }}
          NVIDIA_EMBED_API_KEY: ${{ secrets.NVIDIA_EMBED_API_KEY }}
          NVIDIA_OCR_API_KEY: ${{ secrets.NVIDIA_OCR_API_KEY }}
          NVIDIA_SAFETY_API_KEY: ${{ secrets.NVIDIA_SAFETY_API_KEY }}
          NVIDIA_SPARE_API_KEY: ${{ secrets.NVIDIA_SPARE_API_KEY }}
        run: |
          jq -n 'env | {BUILT_IN_AI_API_KEY, NVIDIA_VISION_API_KEY, NVIDIA_EMBED_API_KEY,
                        NVIDIA_OCR_API_KEY, NVIDIA_SAFETY_API_KEY, NVIDIA_SPARE_API_KEY}
                 | map_values(. // "")' > nvidia_defines.json
          flutter test test/nvidia_live_probe_test.dart --dart-define-from-file=nvidia_defines.json
