name: ai_quiz_app
description: Rivox - The AI App for Learning Anything. AI-powered quiz generator with local-first architecture.
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.3.1
  dio: ^5.8.0+1
  google_fonts: ^8.1.0
  community_charts_flutter: ^1.0.4
  share_plus: ^13.2.0
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.6
  cloud_firestore: ^6.6.0
  google_mobile_ads: ^9.0.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2
  equatable: ^2.0.7
  collection: ^1.19.1
  url_launcher: ^6.3.1
  file_picker: ^12.0.0-beta.7
  path: ^1.9.1
  youtube_player_flutter: ^10.0.1
  webview_flutter: ^4.14.0
  flutter_local_notifications: ^22.0.1
  permission_handler: ^12.0.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  connectivity_plus: ^7.2.0
  flutter_markdown: ^0.7.7+1
  tutorial_coach_mark: ^1.3.3
  html: ^0.15.6
  workmanager: ^0.9.0+3
  app_links: ^7.0.0
  record: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  isar_community_generator: ^3.3.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/rivox_logo.png
  adaptive_icon_background: '#000000'
  adaptive_icon_foreground: assets/branding/rivox_logo.png

flutter:
  generate: false
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/legal/
    - assets/ai/
